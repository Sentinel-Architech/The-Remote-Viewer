[package]
name = "sentinel-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
ethers = { version = "2.0", features = ["ws", "rustls"] }
tokio = { version = "1.0", features = ["full"] }
eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
fips204 = "0.4"

[[bin]]
name = "sentinel-daemon"
path = "src/main.rs"
