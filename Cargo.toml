[package]
name = "sentinel-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
ed25519-dalek = "2.1"
chacha20poly1305 = "0.10"
reqwest = { version = "0.11", features = ["json"] }
scraper = "0.18"
urlencoding = "2.1"
hex = "0.4"
rand = "0.8"
axum = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
