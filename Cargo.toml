[package]
name = "the-remote-viewer"
version = "0.1.0"
edition = "2021"
description = "Local-first zero-trust remote access and data sovereignty"
license = "MIT"   # or keep proprietary and update badges consistently

[dependencies]
tokio = { version = "1", features = ["full"] }
sodiumoxide = "0.2"
sha2 = "0.10"
hex = "0.4"
heed = "0.20"          # or lmdb-rs if you prefer
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Optional / feature-gated for later
# ark-bn254 = "0.4"
# ark-groth16 = "0.4"
# libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub"] }

[features]
default = []
zk = []          # gate the incomplete Groth16 code
