title = "TRV / Sentinel gitleaks config"

[extend]
# Start from the official default rules, then override/add
useDefault = true

[allowlist]
description = "Known safe paths and patterns"
paths = [
  '''docs/.*example.*''',
  '''.*\.example\.(json|md|env)''',
  '''docs/public/.*''',
  '''docs/locked/.*''',
  '''docs/security/.*''',
  '''\.gitleaks\.toml''',
  '''Cargo\.lock''',
  '''package-lock\.json''',
  '''yarn\.lock''',
]
# Common false positives in this repo (hashes, roots, short placeholders)
regexes = [
  '''placeholder-scaffold''',
  '''did:key:placeholder''',
  '''0{32,}''',          # all-zero padding
  '''f{32,}''',          # all-f padding
]

# ---------------------------------------------------------------------------
# High-confidence rules (keep sensitive)
# ---------------------------------------------------------------------------

[[rules]]
id = "trv-private-key"
description = "Private/secret key or seed assignment with long hex value"
regex = '''(?i)(?:private[_-]?key|secret[_-]?key|secretkey|privkey|seed|mnemonic|bip39)\s*[=:]\s*["']?([0-9a-fA-F]{32,})'''
tags = ["key", "trv", "secret"]

[[rules]]
id = "trv-base64-key"
description = "Base64 blob assigned to a key-related variable"
regex = '''(?i)(?:private[_-]?key|secret[_-]?key|secretkey|privkey|seed|mnemonic|api[_-]?key|token)\s*[=:]\s*["']([A-Za-z0-9+/]{40,}={0,2})["']'''
tags = ["key", "base64"]

[[rules]]
id = "generic-api-key"
description = "API key / access token assignment"
regex = '''(?i)(?:api[_-]?key|apikey|access[_-]?token|auth[_-]?token)\s*[=:]\s*["']([A-Za-z0-9_\-.]{20,})["']'''
tags = ["key", "api"]

[[rules]]
id = "generic-secret-assignment"
description = "Password or credential assignment"
regex = '''(?i)(?:password|passwd|pwd|credential)\s*[=:]\s*["']([^"']{8,})["']'''
tags = ["secret", "password"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["aws", "key"]

[[rules]]
id = "github-pat"
description = "GitHub personal access token"
regex = '''gh[pousr]_[A-Za-z0-9_]{36,}'''
tags = ["github", "token"]

[[rules]]
id = "slack-token"
description = "Slack token"
regex = '''xox[baprs]-[0-9a-zA-Z]{10,48}'''
tags = ["slack", "token"]

# ---------------------------------------------------------------------------
# Lower-confidence / noisy patterns — DISABLED by default for this repo
# (Merkle roots, SHA-256 hashes, and commit IDs are common and legitimate)
# Uncomment only if you want maximum paranoia on a clean history.
# ---------------------------------------------------------------------------
