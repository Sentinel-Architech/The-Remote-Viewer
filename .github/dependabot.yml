version: 2

# ---------------------------------------------------------------------------
# Dependabot version updates for The Remote Viewer
# Ecosystems: cargo (Rust), npm (web/mobile/shared), github-actions
# Schedule: weekly. Groups reduce PR noise. Labels aid triage.
# ---------------------------------------------------------------------------

updates:
  # ==========================================================================
  # Rust / Cargo workspace (root Cargo.toml → desktop member)
  # ==========================================================================
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "cargo"
      include: "scope"
    groups:
      # Keep security-sensitive crates visible as individual PRs when major
      cargo-patch-minor:
        update-types:
          - "patch"
          - "minor"

  # ==========================================================================
  # GitHub Actions (ci.yml, command-log.yml, etc.)
  # ==========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # ==========================================================================
  # Web client (apps/web)
  # ==========================================================================
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "web"
    commit-message:
      prefix: "npm(web)"
      include: "scope"
    groups:
      web-production:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      web-dev:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"

  # ==========================================================================
  # Mobile client (apps/mobile) — Expo-sensitive; prefer grouped minors
  # ==========================================================================
  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "mobile"
    commit-message:
      prefix: "npm(mobile)"
      include: "scope"
    groups:
      mobile-production:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      mobile-dev:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"

  # ==========================================================================
  # Shared package (apps/shared)
  # ==========================================================================
  - package-ecosystem: "npm"
    directory: "/apps/shared"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
      - "shared"
    commit-message:
      prefix: "npm(shared)"
      include: "scope"
    groups:
      shared-deps:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
