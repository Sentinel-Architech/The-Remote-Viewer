name: Solana Anchor

on:
  push:
    branches: [TheRemoteViewer, main, master]
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  pull_request:
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: anchor-build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.120.0

      # The solanafoundation/anchor:v0.32.1 image ships Cargo 1.84.0 inside
      # cargo-build-sbf. That Cargo cannot parse edition2024 manifests
      # (toml_edit 0.25). Agave 4.3.0 ships platform-tools v1.57.
      - name: Install Solana CLI 4.3.0
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # npm @coral-xyz/anchor-cli has no 0.32.1 release. This is the
      # published ELF from the v0.32.1 GitHub release.
      - name: Install Anchor 0.32.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/anchor" -L \
            "https://github.com/solana-foundation/anchor/releases/download/v0.32.1/anchor-0.32.1-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Anchor build
        working-directory: solana
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo-build-sbf --version
          anchor --version
          # Compile only. No keygen, no deploy, no mint.
          anchor build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trv-governance-build
          path: |
            solana/target/deploy/*.so
            solana/target/idl/
            solana/idl/
          if-no-files-found: ignore
