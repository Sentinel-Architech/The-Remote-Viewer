name: Solana Anchor

on:
  push:
    branches: [TheRemoteViewer, main, master]
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  pull_request:
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: anchor-build-test
    runs-on: ubuntu-latest
    container:
      image: solanafoundation/anchor:v0.32.1
    defaults:
      run:
        working-directory: solana
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Force Rust 1.85 (edition2024)
        run: |
          set -euo pipefail
          # rust-toolchain.toml requests 1.85; ensure default matches
          rustup install 1.85.0
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Versions
        run: |
          rustc --version
          cargo --version
          solana --version || true
          anchor --version || true

      - name: Keygen
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json --force

      - name: npm install
        run: npm install

      - name: Anchor build
        run: |
          rustup default 1.85.0
          cargo --version
          anchor build

      - name: Anchor test
        run: |
          rustup default 1.85.0
          anchor test
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trv-governance-build
          path: |
            solana/target/deploy/
            solana/target/idl/
            solana/target/types/
          if-no-files-found: ignore
