name: Solana Anchor

on:
  push:
    branches: [TheRemoteViewer, main, master]
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  pull_request:
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: anchor-build-test
    runs-on: ubuntu-latest
    container:
      image: solanafoundation/anchor:v0.31.1
    defaults:
      run:
        working-directory: solana
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          rustc --version || true
          cargo --version || true
          solana --version || true
          anchor --version || true

      - name: Keygen
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json --force

      - name: npm install
        run: npm install

      - name: Pin crates (edition2024 avoidance)
        run: |
          set -euo pipefail
          cargo generate-lockfile 2>/dev/null || true
          cargo update -p digest --precise 0.10.7 || true
          cargo update -p indexmap --precise 2.6.0 || true
          cargo update -p blake3 --precise 1.5.5 || true
          cargo update -p zeroize --precise 1.3.0 || true
          cargo update -p constant_time_eq --precise 0.3.1 || true
          cargo tree -i digest 2>/dev/null | head -15 || true

      - name: Anchor build
        run: anchor build

      - name: Anchor test
        run: anchor test
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trv-governance-build
          path: |
            solana/target/deploy/
            solana/target/idl/
            solana/target/types/
          if-no-files-found: ignore
