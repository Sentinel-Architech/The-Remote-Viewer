name: Solana Anchor

on:
  push:
    branches: [TheRemoteViewer, main, master]
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  pull_request:
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: anchor-build-test
    runs-on: ubuntu-latest
    container:
      image: solanafoundation/anchor:v0.32.1
    defaults:
      run:
        working-directory: solana
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Force Rust 1.85
        run: |
          set -euo pipefail
          rustup install 1.85.0
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Versions
        run: |
          rustc --version
          cargo --version
          solana --version || true
          anchor --version || true

      - name: Keygen
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json --force

      - name: npm install
        run: npm install

      - name: Lockfile on 1.85 + pins
        run: |
          set -euo pipefail
          rustup default 1.85.0
          rm -f Cargo.lock
          cargo generate-lockfile
          # Crates whose latest Cargo.toml uses edition2024 (SBF cargo ~1.84 cannot parse)
          for pin in \
            "digest=0.10.7" \
            "crypto-common=0.1.6" \
            "block-buffer=0.10.4" \
            "indexmap=2.6.0" \
            "blake3=1.5.5" \
            "toml_parser=0.9.3" \
            "constant_time_eq=0.3.1" \
            "zeroize=1.3.0" \
            "hashbrown=0.14.5"
          do
            name="${pin%%=*}"
            ver="${pin#*=}"
            cargo update -p "$name" --precise "$ver" 2>/dev/null || true
          done
          cargo --version
          ls -la Cargo.lock

      - name: Anchor build
        run: |
          set -euo pipefail
          rustup default 1.85.0
          cargo --version
          anchor build

      - name: Anchor test
        run: |
          rustup default 1.85.0
          anchor test
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trv-governance-build
          path: |
            solana/target/deploy/
            solana/target/idl/
            solana/target/types/
          if-no-files-found: ignore
