name: Solana Anchor

on:
  push:
    branches: [TheRemoteViewer, main, master]
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  pull_request:
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  workflow_dispatch:

env:
  ANCHOR_VERSION: "0.30.1"
  SOLANA_VERSION: "1.18.18"
  RUST_LOCK: "1.79.0"
  SOLANA_BIN: "/home/runner/.local/share/solana/install/active_release/bin"

jobs:
  build-and-test:
    name: anchor-build-test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: solana
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev libssl-dev curl

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust 1.79 (lockfile + SBF-era compatible)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_LOCK }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            solana/target
          key: solana-anchor-${{ env.ANCHOR_VERSION }}-${{ env.SOLANA_VERSION }}-lock${{ env.RUST_LOCK }}-v13

      - name: Install Solana CLI
        run: |
          set -euo pipefail
          curl -sSfL "https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install" | sh \
            || curl -sSfL "https://release.solana.com/v${{ env.SOLANA_VERSION }}/install" | sh
          echo "${{ env.SOLANA_BIN }}" >> "$GITHUB_PATH"
          "${{ env.SOLANA_BIN }}/solana" --version

      - name: Install Anchor CLI (npm)
        run: |
          set -euo pipefail
          npm install -g "@coral-xyz/anchor-cli@${{ env.ANCHOR_VERSION }}"
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"
          echo "${{ env.SOLANA_BIN }}" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          anchor --version
          solana --version
          rustc --version
          cargo --version

      - name: Keygen
        run: |
          export PATH="${{ env.SOLANA_BIN }}:$HOME/.cargo/bin:$(npm config get prefix)/bin:$PATH"
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json --force

      - name: npm install (workspace)
        run: npm install

      - name: Lockfile on 1.79 + hard pins
        run: |
          set -euo pipefail
          export PATH="${{ env.SOLANA_BIN }}:$HOME/.cargo/bin:$PATH"
          rustup default ${{ env.RUST_LOCK }}
          rm -f Cargo.lock
          cargo generate-lockfile
          cargo update -p zeroize --precise 1.3.0 || true
          cargo update -p indexmap --precise 2.6.0 || true
          cargo update -p digest --precise 0.10.7 || true
          cargo update -p hashbrown --precise 0.14.5 || true
          cargo update -p base64ct --precise 1.6.0 || true
          echo "=== cargo --version ==="
          cargo --version

      - name: Anchor build
        run: |
          set -euo pipefail
          export PATH="${{ env.SOLANA_BIN }}:$HOME/.cargo/bin:$(npm config get prefix)/bin:$PATH"
          rustup default ${{ env.RUST_LOCK }}
          cargo --version
          anchor --version
          # Do not force RUSTUP_TOOLCHAIN=1.85 — SBF platform-tools ships Cargo ~1.75
          unset RUSTUP_TOOLCHAIN || true
          anchor build

      - name: Anchor test
        run: |
          export PATH="${{ env.SOLANA_BIN }}:$HOME/.cargo/bin:$(npm config get prefix)/bin:$PATH"
          unset RUSTUP_TOOLCHAIN || true
          anchor test
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trv-governance-build
          path: |
            solana/target/deploy/
            solana/target/idl/
            solana/target/types/
          if-no-files-found: ignore
