name: Solana Anchor

on:
  push:
    branches: [TheRemoteViewer, main, master]
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  pull_request:
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  workflow_dispatch:

# Anchor 0.30.1 matrix: Solana 1.18.x, Rust 1.75–1.79, platform-tools ~v1.43
env:
  SOLANA_VERSION: "1.18.26"
  ANCHOR_VERSION: "0.30.1"
  RUST_VERSION: "1.79.0"

jobs:
  build-and-test:
    name: anchor-build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            solana/target
          key: ${{ runner.os }}-a0301-sol${{ env.SOLANA_VERSION }}-z13-v4

      - name: Install Solana ${{ env.SOLANA_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Solana version + keygen
        run: |
          rustc --version
          solana --version
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json --force

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev libssl-dev

      - name: Install Anchor (avm)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} avm --locked --force
          export PATH="$HOME/.cargo/bin:$PATH"
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}
          echo "$HOME/.avm/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          anchor --version

      - name: npm install
        run: npm install

      - name: Resolve zeroize for dalek
        run: |
          cargo update -p zeroize --precise 1.3.0 || true

      - name: Anchor build
        run: anchor build
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}

      - name: Anchor test
        run: anchor test
        continue-on-error: true
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trv-governance-build
          path: |
            solana/target/deploy/
            solana/target/idl/
            solana/target/types/
          if-no-files-found: ignore
