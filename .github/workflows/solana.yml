name: Solana Anchor

on:
  push:
    branches: [TheRemoteViewer, main, master]
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  pull_request:
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  workflow_dispatch:

# Official-ish matrix for Anchor 0.30.1: Solana 1.18.x, Rust ~1.79
env:
  ANCHOR_VERSION: "0.30.1"
  SOLANA_CLI_VERSION: "1.18.18"
  RUST_VERSION: "1.79.0"

jobs:
  build-and-test:
    name: anchor-build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@v4

      - name: Setup Anchor + Solana
        uses: metadaoproject/setup-anchor@v3.1
        with:
          anchor-version: ${{ env.ANCHOR_VERSION }}
          solana-cli-version: ${{ env.SOLANA_CLI_VERSION }}
          node-version: "20.16.0"

      - name: Pin Rust host toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: ${{ runner.os }}-setup-anchor-${{ env.ANCHOR_VERSION }}-${{ env.SOLANA_CLI_VERSION }}-v1

      - name: Versions + keygen
        run: |
          rustc --version
          solana --version
          anchor --version
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json --force

      - name: npm install
        run: npm install

      - name: Resolve zeroize for dalek
        run: cargo update -p zeroize --precise 1.3.0 || true

      - name: Anchor build
        run: anchor build
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}

      - name: Anchor test
        run: anchor test
        continue-on-error: true
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trv-governance-build
          path: |
            solana/target/deploy/
            solana/target/idl/
            solana/target/types/
          if-no-files-found: ignore
