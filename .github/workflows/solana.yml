name: Solana Anchor

on:
  push:
    branches: [TheRemoteViewer, main, master]
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  pull_request:
    paths:
      - "solana/**"
      - ".github/workflows/solana.yml"
  workflow_dispatch:

env:
  ANCHOR_VERSION: "0.30.1"
  SOLANA_VERSION: "1.18.18"
  # Host toolchain for cargo resolve (edition2024 crates need newer Cargo).
  # SBF still uses Solana platform-tools via cargo-build-sbf.
  RUST_VERSION: "1.81.0"
  SOLANA_BIN: "/home/runner/.local/share/solana/install/active_release/bin"

jobs:
  build-and-test:
    name: anchor-build-test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: solana
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev libssl-dev curl

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            solana/target
          key: solana-anchor-${{ env.ANCHOR_VERSION }}-${{ env.SOLANA_VERSION }}-${{ env.RUST_VERSION }}-v10

      - name: Install Solana CLI
        run: |
          set -euo pipefail
          curl -sSfL "https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install" | sh \
            || curl -sSfL "https://release.solana.com/v${{ env.SOLANA_VERSION }}/install" | sh
          echo "${{ env.SOLANA_BIN }}" >> "$GITHUB_PATH"
          "${{ env.SOLANA_BIN }}/solana" --version

      - name: Install Anchor via avm
        run: |
          set -euo pipefail
          export PATH="${{ env.SOLANA_BIN }}:$HOME/.cargo/bin:$PATH"
          cargo install --git https://github.com/coral-xyz/anchor --tag "v${{ env.ANCHOR_VERSION }}" avm --locked --force
          avm install "${{ env.ANCHOR_VERSION }}"
          avm use "${{ env.ANCHOR_VERSION }}"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "${{ env.SOLANA_BIN }}" >> "$GITHUB_PATH"
          anchor --version
          solana --version

      - name: Keygen
        run: |
          export PATH="${{ env.SOLANA_BIN }}:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json --force

      - name: npm install
        run: npm install

      - name: Pin problematic crates
        run: |
          export PATH="${{ env.SOLANA_BIN }}:$HOME/.cargo/bin:$PATH"
          cargo generate-lockfile 2>/dev/null || true
          cargo update -p zeroize --precise 1.3.0 || true
          cargo update -p indexmap --precise 2.6.0 || true

      - name: Anchor build
        run: |
          export PATH="${{ env.SOLANA_BIN }}:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"
          which solana
          which anchor
          anchor build
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}

      - name: Anchor test
        run: |
          export PATH="${{ env.SOLANA_BIN }}:$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"
          anchor test
        continue-on-error: true
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trv-governance-build
          path: |
            solana/target/deploy/
            solana/target/idl/
            solana/target/types/
          if-no-files-found: ignore
