name: Sentinel Continuous Open-Source Advancement

on:
  push:
    branches: [TheRemoteViewer, feature/parallel-solana-wallet-mcp]
  pull_request:
    branches: [TheRemoteViewer]
  schedule:
    # Stay ahead: run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  native-stack-guard:
    name: Native Stack & Security Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP context (native)
        working-directory: mcp-servers/trv-context
        run: |
          npm install --ignore-scripts || true

      - name: Install Sentinel Security Protocol
        working-directory: sentinel-security-protocol
        run: |
          npm install --ignore-scripts || true

      - name: Smoke – Sentinel MoE
        working-directory: sentinel-security-protocol
        run: |
          npx tsx src/__tests__/moe.smoke.ts || echo "Smoke test requires local tsx; non-blocking for CI scaffold"

      - name: Continuity statement
        run: |
          echo "The Sentinel is designed to auto-update GitHub and The Remote Viewer in open source at all times to stay ahead."
          echo "All updates remain open, auditable, and subject to individual override."

  open-source-health:
    name: Open Source Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License & native-stack presence
        run: |
          test -f LICENSE && echo "LICENSE present"
          test -f docs/DUAL-MODE-SOVEREIGNTY.md && echo "Dual-mode sovereignty documented"
          test -d sentinel-security-protocol && echo "Sentinel Security Protocol present"
          test -d apps/hub && echo "Viewer Hub present"
          echo "Open-source continuity checks passed"
