# CodeQL Advanced — narrowed to languages that exist in the native web stack.
# c-cpp / python / rust matrix entries were failing Analyze on schedule and push.
# Keep SAST on for Actions YAML and JavaScript/TypeScript.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "TheRemoteViewer" ]
  pull_request:
    branches: [ "TheRemoteViewer" ]
  schedule:
    - cron: '19 7 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
