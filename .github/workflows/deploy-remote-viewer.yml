name: Deploy Remote Viewer

on:
  push:
    branches: [TheRemoteViewer]
    paths:
      - 'apps/remote-viewer/**'
      - '.github/workflows/deploy-remote-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/remote-viewer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
