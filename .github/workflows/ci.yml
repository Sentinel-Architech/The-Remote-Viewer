name: CI

on:
  push:
    branches: [ TheRemoteViewer, main ]
  pull_request:
    branches: [ TheRemoteViewer, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Secret Scan (gitleaks) — required for branch protection
  # ------------------------------------------------------------------
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # required so gitleaks can scan the entire history

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false   # keep PR noise low

  # ------------------------------------------------------------------
  # Cargo Check — required for branch protection
  # ------------------------------------------------------------------
  cargo-check:
   
