name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, TheRemoteViewer ]

jobs:
  build-solana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: metadaoproject/setup-anchor@v3.4
        with:
          # npm @coral-xyz/anchor-cli@0.31.1 exits without compiling.
          # Agave 2.2 platform-tools cargo is 1.84 and cannot parse edition2024 crates.
          # 4.3.0 ships platform-tools v1.57 (Rust 1.95) and matches this build.
          anchor-version: "0.30.1"
          solana-cli-version: "4.3.0"
      - name: Locate Anchor and Build
        env:
          # Anchor 0.30.1 compiles the IDL with `cargo +nightly` unless this
          # is set. That nightly probe turns on proc-macro2's unstable
          # SourceFile path, and current nightly has no proc_macro::SourceFile.
          # Stable 1.85.0 still compiles that pin. The SBF step keeps using
          # `cargo +solana` from Solana CLI 4.3.0.
          RUSTUP_TOOLCHAIN: "1.85.0"
        run: |
          set -euo pipefail
          unset RUSTC_BOOTSTRAP || true
          rustc --version
          if [ -f "Anchor.toml" ]; then
            # Full build, including the IDL. Host patches live under
            # programs/trv_governance/patches.
            anchor build
          elif [ -f "solana/Anchor.toml" ]; then
            cd solana && anchor build
          else
            cargo build-sbf --release
          fi
      - name: Stage Binaries
        run: |
          mkdir -p staging
          find . -name "*.so" -exec cp {} staging/ \;
          ls -la staging/
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: solana-programs
          path: staging/
