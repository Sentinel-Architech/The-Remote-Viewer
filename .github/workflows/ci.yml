name: CI

on:
  push:
    branches: [ TheRemoteViewer, main ]
  pull_request:
    branches: [ TheRemoteViewer, main ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Secret Scan (gitleaks) — required for branch protection
  # ------------------------------------------------------------------
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required so gitleaks can scan the entire history

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false   # keep PR noise low

  # ------------------------------------------------------------------
  # Cargo Check — required for branch protection
  # ------------------------------------------------------------------
  cargo-check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check desktop crate
        run: cargo check --manifest-path desktop/Cargo.toml

  # ------------------------------------------------------------------
  # Web scaffold — npm cache stub (not required yet)
  # Switch to `npm ci` once package-lock.json is committed.
  # ------------------------------------------------------------------
  web:
    name: Web (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Cache becomes effective after package-lock.json exists
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json — using npm install (commit a lockfile for reproducible CI)"
            npm install
          fi

      # Stub — replace with real checks when ready:
      # - run: npm run lint
      # - run: npm run test
      # - run: npm run build
      - name: Verify package installs
        run: npm ls --depth=0 || true

  # ------------------------------------------------------------------
  # Mobile scaffold — npm cache stub (not required yet)
  # Switch to `npm ci` once package-lock.json is committed.
  # ------------------------------------------------------------------
  mobile:
    name: Mobile (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json — using npm install (commit a lockfile for reproducible CI)"
            npm install
          fi

      # Stub — replace with real checks when ready:
      # - run: npx tsc --noEmit
      # - run: npm run lint
      # - run: npx expo-doctor
      - name: Verify package installs
        run: npm ls --depth=0 || true
