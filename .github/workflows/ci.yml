name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-solana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: metadaoproject/setup-anchor@v3.4
      - name: Locate Anchor and Build
        run: |
          if [ -f "Anchor.toml" ]; then
            anchor build --ignore-keys
          elif [ -f "solana/Anchor.toml" ]; then
            cd solana && anchor build --ignore-keys
          else
            cargo build-sbf --release
          fi
      - name: Stage Binaries
        run: |
          mkdir -p staging
          find . -name "*.so" -exec cp {} staging/ \;
          ls -la staging/
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: solana-programs
          path: staging/
