name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-solana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: metadaoproject/setup-anchor@v3.3
      - name: Inspect Workspace
        run: |
          pwd
          ls -la
          find . -name "Anchor.toml"
      - name: Build Program
        run: anchor build --ignore-keys
      - name: Find and Stage Artifacts
        run: |
          mkdir -p staging
          find . -name "*.so" -exec cp {} staging/ \;
          ls -la staging/
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solana-programs
          path: staging/
