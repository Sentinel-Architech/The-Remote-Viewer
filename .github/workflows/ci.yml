name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-solana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: metadaoproject/setup-anchor@v3.3
      - name: Build Program
        run: anchor build --ignore-keys
        working-directory: solana
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trv_governance.so
          path: solana/target/deploy/trv_governance.so
