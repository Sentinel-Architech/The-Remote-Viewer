name: Sentinel Protocol Security & Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  matrix-security-scan:
    name: Security Scan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Cargo Registry & Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Install Static Analyzers (Slither & Aderyn)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer solc-select
          solc-select install 0.8.20
          solc-select use 0.8.20
          
          if ! command -v aderyn &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cyfrin/aderyn/releases/latest/download/aderyn-installer.sh | bash || true
            echo "$HOME/.cyfrin/bin" >> $GITHUB_PATH
          fi

      - name: Run Foundry Invariant Tests
        shell: bash
        run: forge test --fuzz-runs 500 -vvv

      - name: Run Slither (Generate SARIF)
        shell: bash
        continue-on-error: true
        run: |
          slither . --export-sarif slither.sarif --filter-paths "lib|node_modules" || true

      - name: Upload Slither SARIF
        if: matrix.os == 'ubuntu-latest' && hashFiles('slither.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: slither.sarif
          category: slither-analyzer

      - name: Run Aderyn (Generate SARIF)
        shell: bash
        continue-on-error: true
        run: |
          aderyn --output aderyn.sarif || true

      - name: Upload Aderyn SARIF
        if: matrix.os == 'ubuntu-latest' && hashFiles('aderyn.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aderyn.sarif
          category: aderyn-analyzer
