name: Renovate

# ---------------------------------------------------------------------------
# Manual-only Renovate (Dependabot is the default version bot).
# Trigger: Actions → Renovate → Run workflow
#
# Auth (either):
#   A) GitHub App: RENOVATE_APP_ID + RENOVATE_APP_PRIVATE_KEY
#   B) PAT fallback: RENOVATE_TOKEN (contents + pull requests + issues + workflows)
#
# Inputs:
#   dryRun      full = log only (default) | false = open/update PRs
#   logLevel    info | debug | warn
#   baseBranch  empty = TheRemoteViewer + main | or a single branch name
# ---------------------------------------------------------------------------

on:
  # schedule:
  #   - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Mode — full = log only (no PRs); false = open/update PRs'
        required: true
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'false'
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - 'info'
          - 'debug'
          - 'warn'
      baseBranch:
        description: 'Base branch (leave empty for TheRemoteViewer + main)'
        required: false
        default: ''
        type: string

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Self-hosted Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Create GitHub App installation token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Require credentials
        if: steps.app-token.outcome != 'success' && secrets.RENOVATE_TOKEN == ''
        run: |
          echo "::error::No credentials configured."
          echo "Set RENOVATE_APP_ID + RENOVATE_APP_PRIVATE_KEY, or RENOVATE_TOKEN."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate (GitHub App)
        if: steps.app-token.outcome == 'success'
        uses: renovatebot/github-action@v46.1.21
        with:
          configurationFile: .github/renovate-config.js
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == 'full' && 'full' || '' }}
          RENOVATE_BASE_BRANCHES: ${{ inputs.baseBranch != '' && format('["{0}"]', inputs.baseBranch) || '["TheRemoteViewer","main"]' }}

      - name: Self-hosted Renovate (PAT fallback)
        if: steps.app-token.outcome != 'success'
        uses: renovatebot/github-action@v46.1.21
        with:
          configurationFile: .github/renovate-config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == 'full' && 'full' || '' }}
          RENOVATE_BASE_BRANCHES: ${{ inputs.baseBranch != '' && format('["{0}"]', inputs.baseBranch) || '["TheRemoteViewer","main"]' }}
