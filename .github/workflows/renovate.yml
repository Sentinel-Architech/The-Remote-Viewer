name: Renovate

# ---------------------------------------------------------------------------
# Manual-only Renovate (Dependabot is the default version bot).
# Trigger: Actions → Renovate → Run workflow
#
# Auth (either):
#   A) GitHub App: RENOVATE_APP_ID + RENOVATE_APP_PRIVATE_KEY
#   B) PAT fallback: RENOVATE_TOKEN (contents + pull requests + issues + workflows)
#
# To re-enable weekly runs later: uncomment the schedule block and disable
# Dependabot version updates so the two bots do not double-open PRs.
# ---------------------------------------------------------------------------

on:
  # schedule:
  #   - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Mode — full = log only (no PRs); false = open/update PRs'
        required: true
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'false'
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - 'info'
          - 'debug'
          - 'warn'
      baseBranch:
        description: 'Base branch to target (empty = both TheRemoteViewer and main)'
        required: false
        default: ''
        type: string

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Self-hosted Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Create GitHub App installation token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Resolve token
        id: token
        run: |
          set -euo pipefail
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "Using GitHub App installation token"
            echo "value=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.RENOVATE_TOKEN }}" ]; then
            echo "Using RENOVATE_TOKEN (PAT fallback)"
            echo "value=${{ secrets.RENOVATE_TOKEN }}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No credentials. Set RENOVATE_APP_ID + RENOVATE_APP_PRIVATE_KEY, or RENOVATE_TOKEN."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.0.2
        with:
          configurationFile: .github/renovate-config.js
          token: ${{ steps.token.outputs.value }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == 'full' && 'full' || '' }}
          RENOVATE_BASE_BRANCHES: ${{ inputs.baseBranch != '' && format('["{0}"]', inputs.baseBranch) || '["TheRemoteViewer","main"]' }}
