name: Renovate

# ---------------------------------------------------------------------------
# PARKED — Dependabot handles version updates for now.
# Files kept: renovate.json, .github/renovate-config.js, this workflow.
# To enable later: add RENOVATE_APP_ID + RENOVATE_APP_PRIVATE_KEY secrets,
# then restore the schedule cron below (and turn off Dependabot version updates).
# ---------------------------------------------------------------------------
# GitHub App permissions (when you enable):
#   Contents, Pull requests, Issues, Workflows, Checks, Commit statuses:
#     Read & write
#   Metadata: Read | Administration: Read | Dependabot alerts: Read
# ---------------------------------------------------------------------------

on:
  # schedule disabled while parked — uncomment when secrets are set:
  # schedule:
  #   - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run only (log what would happen, open no PRs)'
        required: false
        default: 'full'
        type: choice
        options:
          - 'false'
          - 'full'

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Self-hosted Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.0.2
        with:
          configurationFile: .github/renovate-config.js
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == 'full' && 'full' || '' }}
          RENOVATE_BASE_BRANCHES: '["TheRemoteViewer","main"]'
