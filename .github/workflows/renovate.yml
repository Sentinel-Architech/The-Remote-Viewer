name: Renovate

# ---------------------------------------------------------------------------
# Self-hosted Renovate authenticated as a GitHub App (recommended).
#
# Secrets required:
#   RENOVATE_APP_ID          — numeric App ID from the app's settings page
#   RENOVATE_APP_PRIVATE_KEY — PEM private key (full file contents)
#
# Fallback: if you prefer a PAT instead of an App, comment out the
# "Create GitHub App token" step and set token: ${{ secrets.RENOVATE_TOKEN }}
#
# ---------------------------------------------------------------------------
# GitHub App — repository permissions (least privilege for Renovate)
# ---------------------------------------------------------------------------
# Permission              Access        Why
# Contents                Read & write  Branches, commits, file updates
# Pull requests           Read & write  Open / update dependency PRs
# Issues                  Read & write  Dependency Dashboard issue
# Workflows               Read & write  Bump actions in .github/workflows
# Checks                  Read & write  Status on Renovate PRs
# Commit statuses         Read & write  Commit status API
# Metadata                Read          Required for every GitHub App
# Administration          Read          Read branch protection rules
# Dependabot alerts       Read          Optional vulnerability-driven PRs
#
# Installation: this repository only (not all repos).
# Webhooks: disable (schedule + workflow_dispatch are enough).
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run only (log what would happen, open no PRs)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'full'

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Self-hosted Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.0.2
        with:
          configurationFile: .github/renovate-config.js
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun == 'full' && 'full' || '' }}
          RENOVATE_BASE_BRANCHES: '["TheRemoteViewer","main"]'
