name: Renovate

# ---------------------------------------------------------------------------
# Self-hosted Renovate via GitHub App (preferred) or PAT fallback.
#
# Preferred secrets (GitHub App — short-lived installation tokens):
#   RENOVATE_APP_ID          — App ID (or Client ID) from the app settings page
#   RENOVATE_APP_PRIVATE_KEY — full PEM private key generated for the app
#
# Fallback (legacy PAT):
#   RENOVATE_TOKEN           — fine-grained or classic PAT
#
# App permission checklist (Repository permissions):
#   Contents ............ Read and write
#   Pull requests ....... Read and write
#   Issues .............. Read and write   (Dependency Dashboard)
#   Workflows ........... Read and write   (update .github/workflows)
#   Checks .............. Read and write
#   Commit statuses ..... Read and write
#   Metadata ............ Read (always required)
#   Administration ...... Read             (branch protection awareness)
#   Dependabot alerts ... Read             (vulnerability PRs)
#
# Install the app on this repo only (or selected repos). No org-wide needed.
# Disable webhooks on the app unless you want them — schedule is enough.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run only (log what would happen, open no PRs)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'full'

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Self-hosted Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Create GitHub App token
        id: app-token
        if: ${{ vars.RENOVATE_APP_ID != '' || secrets.RENOVATE_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          # Prefer Client ID (vars); App ID still works
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.0.2
        with:
          configurationFile: .github/renovate-config.js
          # App token when present; otherwise PAT secret
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun == 'full' && 'full' || '' }}
          RENOVATE_BASE_BRANCHES: '["TheRemoteViewer","main"]'
