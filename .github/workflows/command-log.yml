name: Update Command Log

on:
  push:
    branches: [ TheRemoteViewer, main ]
    paths:
      - 'SECURITY.md'
      - '.gitleaks.toml'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'docs/security/**'
      - 'docs/public/**'
      - 'desktop/src/**'
      - 'desktop/Cargo.toml'
      - 'README.md'
  workflow_dispatch:
    # Manual run button — useful after a batch of local commits

permissions:
  contents: write

jobs:
  append-log:
    runs-on: ubuntu-latest
    # Avoid infinite loop: do not re-trigger when the only change is the log itself
    if: "!contains(github.event.head_commit.message, 'Auto-update command log')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build log entry from recent commits
        id: entry
        run: |
          set -e
          LOG_FILE="docs/public/COMMAND-LOG.md"
          mkdir -p docs/public

          # Collect commits that touched the watched paths (last 5, non-merge)
          COMMITS=$(git log -5 --no-merges --pretty=format:'%h|%s|%an|%ad' --date=short -- \
            SECURITY.md \
            .gitleaks.toml \
            .github/workflows \
            .github/dependabot.yml \
            docs/security \
            docs/public \
            desktop/src \
            desktop/Cargo.toml \
            README.md \
            || true)

          if [ -z "$COMMITS" ]; then
            echo "No relevant commits found — skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

          DATE=$(date -u +%Y-%m-%d)
          ENTRY_FILE=$(mktemp)

          {
            echo ""
            echo "---"
            echo ""
            echo "## Auto entry — ${DATE}"
            echo ""
            echo "Generated by ".github/workflows/command-log.yml". Non-secret commits only."
            echo ""
            echo "| Commit | Message | Author | Date |"
            echo "|--------|---------|--------|------|"
            echo "$COMMITS" | while IFS='|' read -r hash subject author date; do
              # Skip anything that looks like it might contain secrets (defensive)
              if echo "$subject" | grep -qiE 'key|secret|token|password|seed|mnemonic'; then
                continue
              fi
              echo "| \`${hash}\` | ${subject} | ${author} | ${date} |"
            done
            echo ""
          } > "$ENTRY_FILE"

          # Append only if this exact auto-entry block is not already present
          if ! grep -q "## Auto entry — ${DATE}" "$LOG_FILE" 2>/dev/null; then
            cat "$ENTRY_FILE" >> "$LOG_FILE"
            echo "Appended new auto entry for ${DATE}"
          else
            echo "Entry for ${DATE} already exists — skipping append."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated log
        if: steps.entry.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/COMMAND-LOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update command log [skip ci]"
          git push
