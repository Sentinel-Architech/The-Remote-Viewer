name: Update Command Log

# ---------------------------------------------------------------------------
# Automatically appends a dated, non-secret commit table to
# docs/public/COMMAND-LOG.md when security / CI / docs paths change.
# Lands via short-lived branch + PR (GH006: required build-solana blocks
# github-actions direct push to TheRemoteViewer). Do not weaken protection
# without Architect. Manual narrative entries still go above auto sections.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ TheRemoteViewer, main ]
    # Only run when paths that matter to the security/infra log change
    paths:
      - 'SECURITY.md'
      - '.gitleaks.toml'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'docs/security/**'
      - 'docs/public/**'
      - 'desktop/src/**'
      - 'desktop/Cargo.toml'
      - 'README.md'
  workflow_dispatch:   # Allow manual runs from the Actions tab

permissions:
  contents: write      # Commit to short-lived auto/command-log-* branch
  pull-requests: write # Open/update PR into TheRemoteViewer (GH006: no direct push)

jobs:
  append-log:
    runs-on: ubuntu-latest
    # Prevent infinite loop: ignore pushes that only updated the log itself
    if: "!contains(github.event.head_commit.message, 'Auto-update command log')"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 10                    # Enough history for recent commits
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build log entry from recent commits
        id: entry
        run: |
          # Fail on error, undefined vars, and pipeline failures
          set -euo pipefail

          LOG_FILE="docs/public/COMMAND-LOG.md"
          ENTRY_FILE=""

          # Always clean up the temp file on exit (success or failure)
          cleanup() {
            if [ -n "${ENTRY_FILE}" ] && [ -f "${ENTRY_FILE}" ]; then
              rm -f "${ENTRY_FILE}"
            fi
          }
          trap cleanup EXIT

          # Ensure the docs/public directory exists
          if ! mkdir -p docs/public; then
            echo "ERROR: failed to create docs/public" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # ------------------------------------------------------------------
          # Collect recent commits that touched the watched paths.
          # Temporarily disable -e so an empty result does not abort the job.
          # ------------------------------------------------------------------
          set +e
          COMMITS=$(git log -8 --no-merges --pretty=format:'%h|%s|%an|%ad' --date=short -- \
            SECURITY.md \
            .gitleaks.toml \
            .github/workflows \
            .github/dependabot.yml \
            docs/security \
            docs/public \
            desktop/src \
            desktop/Cargo.toml \
            README.md 2>/dev/null)
          GIT_LOG_STATUS=$?
          set -e

          if [ $GIT_LOG_STATUS -ne 0 ]; then
            echo "WARNING: git log returned status ${GIT_LOG_STATUS} — treating as no commits" >&2
            COMMITS=""
          fi

          if [ -z "${COMMITS}" ]; then
            echo "No relevant commits found — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # UTC date used as the section heading (one auto-entry per day)
          DATE=$(date -u +%Y-%m-%d) || {
            echo "ERROR: failed to get UTC date" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 1
          }

          ENTRY_FILE=$(mktemp) || {
            echo "ERROR: failed to create temp file" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 1
          }

          # Patterns that suggest a commit subject might contain or reference secrets.
          # Matching subjects are excluded from the public log.
          SECRET_FILTER='(?i)(private.?key|secret.?key|api.?key|access.?token|auth.?token|bearer |password|passwd|mnemonic|bip39|seed phrase|gh[pousr]_|xox[baprs]-|AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{20,}|[0-9a-fA-F]{64,})'

          # ------------------------------------------------------------------
          # Build the markdown table into the temp file
          # ------------------------------------------------------------------
          {
            echo ""
            echo "---"
            echo ""
            echo "## Auto entry — ${DATE}"
            echo ""
            echo "Generated by .github/workflows/command-log.yml. Non-secret commits only."
            echo ""
            echo "| Commit | Message | Author | Date |"
            echo "|--------|---------|--------|------|"

            ROW_COUNT=0
            while IFS='|' read -r hash subject author cdate; do
              # Skip malformed lines (missing hash or subject)
              if [ -z "${hash}" ] || [ -z "${subject}" ]; then
                continue
              fi

              # Drop subjects that look like they mention secrets
              if echo "${subject}" | grep -qE "${SECRET_FILTER}"; then
                echo "Skipping potential secret-bearing subject: ${hash}" >&2
                continue
              fi

              # Drop the auto-log commits themselves
              if echo "${subject}" | grep -qi 'auto-update command log'; then
                continue
              fi

              # Escape pipe characters so the markdown table does not break
              safe_subject=$(echo "${subject}" | sed 's/|/\\|/g')
              echo "| \`${hash}\` | ${safe_subject} | ${author} | ${cdate} |"
              ROW_COUNT=$((ROW_COUNT + 1))
            done <<< "${COMMITS}"

            echo ""

            # Honest note when every candidate was filtered out
            if [ "${ROW_COUNT}" -eq 0 ]; then
              echo "_No non-secret commits to record for this window._"
              echo ""
            fi
          } > "${ENTRY_FILE}"

          # Bootstrap the log file if it does not exist yet
          if [ ! -f "${LOG_FILE}" ]; then
            {
              echo "# Command & Decision Log"
              echo ""
              echo "**Purpose:** Transparent record of non-secret security and infrastructure changes."
              echo "**Rule:** No secrets, keys, tokens, or private material."
              echo ""
            } > "${LOG_FILE}" || {
              echo "ERROR: failed to create ${LOG_FILE}" >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 1
            }
          fi

          # One auto-entry section per calendar day — skip if already present
          if grep -q "## Auto entry — ${DATE}" "${LOG_FILE}" 2>/dev/null; then
            echo "Entry for ${DATE} already exists — skipping append."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! cat "${ENTRY_FILE}" >> "${LOG_FILE}"; then
            echo "ERROR: failed to append entry to ${LOG_FILE}" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Appended new auto entry for ${DATE}"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Open PR with updated log (GH006-safe)
        # Direct push to TheRemoteViewer fails GH006: required check "build-solana".
        # Land COMMAND-LOG updates via short-lived branch + PR instead. Do NOT weaken
        # branch protection without Architect.
        if: steps.entry.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f docs/public/COMMAND-LOG.md ]; then
            echo "ERROR: COMMAND-LOG.md missing after build step" >&2
            exit 1
          fi

          git add -f docs/public/COMMAND-LOG.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          BRANCH="auto/command-log-${DATE}"

          # Detach from protected tip onto a short-lived branch
          git checkout -B "${BRANCH}"

          git commit -m "Auto-update command log ${DATE}" || {
            echo "ERROR: git commit failed" >&2
            exit 1
          }

          git push -u origin "${BRANCH}" --force-with-lease || {
            echo "ERROR: git push to ${BRANCH} failed" >&2
            exit 1
          }

          # Reuse open PR for this branch if present; else create
          EXISTING=$(gh pr list -R "${{ github.repository }}" --head "${BRANCH}" --base TheRemoteViewer --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            echo "PR #${EXISTING} already open for ${BRANCH}"
            gh pr comment "${EXISTING}" -R "${{ github.repository }}" --body "Refreshed COMMAND-LOG auto entry for ${DATE}."
          else
            gh pr create -R "${{ github.repository }}"               --base TheRemoteViewer               --head "${BRANCH}"               --title "Auto-update command log ${DATE}"               --body "$(cat <<EOF
## Summary
- Automated COMMAND-LOG append for ${DATE}
- Lands via PR because direct push to \`TheRemoteViewer\` is blocked by GH006 (required status check \`build-solana\`)

## Rails
- No branch-protection weakening
- Architect merge when \`build-solana\` is green

EOF
)"
          fi

          echo "Command log PR path complete for ${BRANCH}"
