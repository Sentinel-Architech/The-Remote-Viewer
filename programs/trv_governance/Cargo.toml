[package]
name = "trv_governance"
version = "0.1.0"
description = "TRV Solana governance and posture verification program"
edition = "2021"

# Own workspace so cargo-build-sbf does not treat this crate as a
# non-member of the desktop workspace at the repo root.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "trv_governance"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

[profile.release]
overflow-checks = true
