[package]
name = "trv_governance"
version = "0.1.0"
description = "TRV Solana governance and posture verification program"
edition = "2021"

# Own workspace so cargo-build-sbf does not treat this crate as a
# non-member of the desktop workspace at the repo root.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "trv_governance"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "0.30.1"
# anchor-spl pulls solana-sdk, whose PacketFlags serde derive does not compile
# on this host toolchain. This program does not use SPL types.
# anchor-syn 0.30.1 calls Span::source_file(), removed in proc-macro2 1.0.95.
proc-macro2 = { version = "=1.0.94", features = ["span-locations"] }

[profile.release]
overflow-checks = true

# Host rustc 1.85 parses MontFp!("...") as a bare literal.
# The crates.io 0.4.2 macro panics on that shape. This patch accepts it.
[patch.crates-io]
ark-ff-macros = { path = "patches/ark-ff-macros" }
# anchor-syn 0.30.1 splits seed token streams on '.' without trimming.
# That drops PDA seeds out of the IDL impl and the raw expression does not compile.
anchor-syn = { path = "patches/anchor-syn" }
