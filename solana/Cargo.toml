[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.dependencies]
# Cargo 1.79 (platform-tools era) cannot parse indexmap >=2.8 edition2024 manifests.
indexmap = "=2.6.0"
zeroize = "=1.3.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
