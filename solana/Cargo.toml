[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# zeroize_derive 1.5+ requires cargo edition2024 (Rust >= 1.85).
# Pin for Anchor 0.30.1 + Rust 1.79 CI toolchain.
[patch.crates-io]
zeroize_derive = { version = "=1.4.2" }
zeroize = { version = "=1.7.0" }
