[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# anchor-syn 0.32.2 calls Span::unwrap() before local_file(). That converts
# the span to proc_macro::Span, which has no local_file(), so the IDL build
# fails. This copy calls local_file() on the proc_macro2 span and trims PDA
# seed paths. The crates.io crate is unchanged on crates.io; this path is the
# copy the Solana workspace compiles.
[patch.crates-io]
anchor-syn = { path = "patches/anchor-syn" }
