[package]
name = "trv_governance"
version = "0.1.0"
description = "TRV governance program — SCAFFOLD ONLY"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "trv_governance"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
# Pin: zeroize_derive 1.5 requires cargo edition2024 (Rust 1.85+)
zeroize = "=1.7.0"
zeroize_derive = "=1.4.2"
