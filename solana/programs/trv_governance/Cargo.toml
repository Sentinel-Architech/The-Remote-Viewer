[package]
name = "trv_governance"
version = "0.1.0"
description = "TRV governance program — SCAFFOLD ONLY"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "trv_governance"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
# SBF/platform-tools Cargo ~1.79 cannot parse edition2024 crate manifests
digest = "=0.10.7"
indexmap = "=2.6.0"
blake3 = "=1.5.5"
