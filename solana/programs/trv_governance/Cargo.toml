[package]
name = "trv_governance"
version = "0.1.0"
description = "TRV governance program — SCAFFOLD ONLY"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "trv_governance"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
# Pins: dalek needs zeroize <1.4; Cargo 1.79 cannot parse indexmap 2.14 edition2024
zeroize = "=1.3.0"
indexmap = "=2.6.0"
