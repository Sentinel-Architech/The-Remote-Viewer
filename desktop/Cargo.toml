[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Remote Viewer desktop orchestrator"

[[bin]]
name = "remote-viewer"
path = "src/main.rs"

[features]
default = ["runtime"]
runtime = ["dep:sled"]
tauri-ipc = ["dep:tauri", "runtime"]
ollama = ["dep:ollama-rs", "dep:tokio-stream"]
zkml = ["dep:tract-onnx"]

[dependencies]
tokio = { version = "1", features = ["full"] }
sodiumoxide = "0.2"
sha2 = "0.11"
hex = "0.4"
heed = "0.22"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
zeroize = "1"
sled = { version = "0.34", optional = true }
tauri = { version = "2", optional = true }
ollama-rs = { version = "0.2", optional = true }
tokio-stream = { version = "0.1", optional = true }
tract-onnx = { version = "0.23", optional = true }
